name: Package safety
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  screenshot:
    name: Screenshot workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate capture and editor workflow without a desktop
        run: |
          bash -n screenshot.sh
          python3 -m unittest discover -s packaging/arch/tests -v
  package:
    needs: screenshot
    uses: MichaelWeissDEV/dotfiles/.github/workflows/component.yml@main
    secrets:
      DOTFILES_DISPATCH_TOKEN: ${{ secrets.DOTFILES_DISPATCH_TOKEN }}
